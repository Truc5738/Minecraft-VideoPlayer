name: Minecraft-VideoPlayer
version: 1.1.0
main: dev.minecraftvideoplayer.VideoPlayerPlugin
api-version: '26.2'
author: Truc5738
description: Unified Minecraft Video Center for Java and Bedrock/PE.
commands:
  video:
    description: Open the Video Center
    usage: /video
    aliases: [videos]
permissions:
  videoplayer.use:
    description: Use the Video Center
    default: true
  videoplayer.admin:
    description: Use admin controls and reload configuration
    default: op
