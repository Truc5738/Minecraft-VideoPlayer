server:
  web-host: "0.0.0.0"
  web-port: 26467
  public-url: ""
  # Strong random token. Required for browser uploads/admin API.
  admin-token: ""

upload:
  enabled: true
  max-size-mb: 2048
  allowed-extensions:
    - mp4
    - mov
  movies-directory: "movies"

youtube:
  enabled: true
  api-keys: []
  api-key: ""
  max-results: 10

player:
  default-volume: 80
  autoplay: true
  allow-youtube: true
  allow-mp4: true
  allow-hls: true

rooms:
  max-per-player: 3
  max-viewers: 50

language: "en"
