name: Build Minecraft-VideoPlayer

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        run: mvn -B -U clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-VideoPlayer
          path: target/*.jar
